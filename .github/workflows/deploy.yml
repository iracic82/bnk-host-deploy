name: deploy

# Merging to main is the approval. For every cluster the merge affected, the installer runs a plan
# and then the install, in the same job, so nothing is applied that was not planned seconds before.
# Re-running is safe: every phase converges, so a second run changes nothing on a healthy cluster.
#
# On GitHub, add required reviewers to the "bnk-<env>" environment for a second approval gate.
on:
  push:
    branches: [main]
    paths:
      - clusters/**
      - environments/**
      - profiles/**
      - lib/**
      - versions.env
      - install.sh
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster file to (re)apply, e.g. clusters/lab.yaml. Empty = every enabled cluster."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Never two installs at once, and never cancel one half way: a queued deploy waits its turn.
  group: bnk-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # One owner per cluster. The repository variable BNK_INSTALLER says which orchestrator installs
    # BNK: "pipeline" (these workflows), "forge" or "argocd". Anything else and this job stands aside,
    # so a merge never has two tools racing to install the same cluster.
    if: vars.BNK_INSTALLER == 'pipeline'
    runs-on: [self-hosted, bnk]
    environment: bnk-lab
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pinned tools
        run: ./ci/tools.sh

      - name: which clusters does this merge affect?
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.cluster }}" ]; then echo "${{ inputs.cluster }}"; else ./ci/targets.sh --all; fi
          else
            ./ci/targets.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi | tee "$RUNNER_TEMP/targets"
          [ -s "$RUNNER_TEMP/targets" ] || echo "no cluster is affected by this merge"

      - name: credentials
        env:
          FAR_PULL_B64: ${{ secrets.FAR_PULL_B64 }}
          BNK_LICENSE_JWT: ${{ secrets.BNK_LICENSE_JWT }}
        run: |
          [ -s "$RUNNER_TEMP/targets" ] || exit 0
          [ -n "$FAR_PULL_B64" ] || { echo "::error::repository secret FAR_PULL_B64 is not set"; exit 1; }
          [ -n "$BNK_LICENSE_JWT" ] || { echo "::error::repository secret BNK_LICENSE_JWT is not set"; exit 1; }
          umask 077
          printf '%s' "$FAR_PULL_B64" > "$RUNNER_TEMP/far.json"
          printf '%s' "$BNK_LICENSE_JWT" > "$RUNNER_TEMP/license.jwt"

      - name: plan, then install
        env:
          FAR_PULL_JSON: ${{ runner.temp }}/far.json
          BNK_LICENSE_FILE: ${{ runner.temp }}/license.jwt
          BNK_ORCHESTRATOR: pipeline
        run: |
          while read -r f; do
            [ -n "$f" ] || continue
            if [ "$(yq -r '.enabled' "$f")" != "true" ]; then echo "skip $f: enabled is false"; continue; fi
            echo "::group::plan $f";    ./install.sh --cluster "$f" --plan; echo "::endgroup::"
            echo "::group::install $f"; ./install.sh --cluster "$f";        echo "::endgroup::"
          done < "$RUNNER_TEMP/targets"

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide | grep -vE 'Running|Completed' || true
          kubectl get cneinstance -A -o jsonpath='{range .items[*].status.conditions[*]}{.type}={.status} {.message}{"\n"}{end}' || true
          kubectl logs -n f5-cne-core deploy/f5-lifecycle-operator --tail=60 || true

      - name: wipe credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/far.json" "$RUNNER_TEMP/license.jwt"
