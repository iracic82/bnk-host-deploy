! edge-router: Northwind's data-center edge for cluster six.
frr defaults traditional
hostname edge-router
log stdout informational
ip forwarding
!
interface eth1
 description dc-edge: toward bnk-worker, where TMM takes 10.10.10.11
 ip address 10.10.10.254/24
exit
!
interface eth2
 description client-net: toward the users
 ip address 10.20.20.254/24
exit
!
! The VIP pool BNK hands to Gateways lives behind TMM's external self IP.
ip route 10.30.30.0/24 10.10.10.11
!
line vty
