# A first app behind BNK. DevOps' half of the Gateway API story: a Gateway that asks the
# f5-gateway-class for an address, and a route to the Service. NetOps' half (the class, the VIP
# pool, TMM's VLANs) is clusters/lab.network.yaml, already in place.
apiVersion: v1
kind: Namespace
metadata:
  name: hello
  labels: {app.kubernetes.io/part-of: apps}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels: {app.kubernetes.io/part-of: apps}
spec:
  replicas: 3
  selector: {matchLabels: {app: hello}}
  template:
    metadata: {labels: {app: hello}}
    spec:
      containers:
        - name: whoami                       # answers with its pod name and the request it saw
          image: traefik/whoami:v1.11.0
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
  labels: {app.kubernetes.io/part-of: apps}
spec:
  selector: {app: hello}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello
  namespace: hello
  labels: {app.kubernetes.io/part-of: apps}
spec:
  gatewayClassName: f5-gateway-class
  addresses: [{type: IPAddress, value: 10.30.30.10}]   # from the VIP pool; omit to take the next free one
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: hello
  labels: {app.kubernetes.io/part-of: apps}
spec:
  parentRefs: [{name: hello, sectionName: http}]
  rules:
    - backendRefs: [{name: hello, port: 80}]
