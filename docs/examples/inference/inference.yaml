# The AI team's first model behind BIG-IP Next for Kubernetes, on NVIDIA Dynamo.
# No GPUs in this lab: Dynamo's Mocker engine models what a real GPU worker does (scheduling, the KV
# cache, prefill and decode timing) and, like a real worker, publishes KV-cache events on NATS.
#
#   DynamoGraphDeployment mocker  Dynamo's frontend, and three Mocker decode workers ("GPUs"). Each worker
#                                 pod has a frontend sidecar in direct mode: it serves exactly the worker
#                                 BNK's picker named. Each KV cache is small on purpose: a few prompts.
#   InferencePool model-pool      the decode workers
#   F5EPP model-pool-epp          BNK's endpoint picker, engine dynamo: reads the workers' KV-cache events
#                                 from NATS and names the worker that already holds the prompt
#   Gateway ai-picker  10.30.30.11 -> HTTPRoute chat    -> InferencePool (BNK's picker decides)
#   Gateway ai-roundrobin 10.30.30.12 -> HTTPRoute chat-rr -> Dynamo's frontend (its default round robin)
#
# Prerequisites, owned by the platform team: inference.epp_namespaces lists this namespace (phase 47),
# and the Dynamo platform runs (lab dynamo).
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: mocker
  namespace: inference
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.5.1
          env: [{name: DYN_EVENT_PLANE, value: nats}]     # BNK's picker reads KV events from NATS
          resources: {requests: {cpu: 100m, memory: 512Mi}}
  - name: decode
    type: decode
    replicas: 3
    frontendSidecar: sidecar-frontend
    podTemplate:
      spec:
        topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {nvidia.com/dynamo-component-type: decode}}}
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.5.1
          workingDir: /workspace
          command: [python3, -m, dynamo.mocker]
          # block size 16 matches the picker's (F5EPP spec.blockSize). 96 blocks of KV cache per worker:
          # room for about four of the customers' long prompts, like a busy GPU.
          args: [--model-path, Qwen/Qwen3-0.6B, --model-name, Qwen/Qwen3-0.6B, --speedup-ratio, "1.0",
                 --block-size, "16", --num-gpu-blocks-override, "96"]
          envFrom: [{secretRef: {name: hf-token-secret}}]
          env: [{name: DYN_EVENT_PLANE, value: nats}]
          resources: {requests: {cpu: 200m, memory: 1Gi}}
        - name: sidecar-frontend
          image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.5.1
          args: [-m, dynamo.frontend, --router-mode, direct]
          envFrom: [{secretRef: {name: hf-token-secret}}]
          resources: {requests: {cpu: 50m, memory: 512Mi}}
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata: {name: model-pool, namespace: inference}
spec:
  selector:
    matchLabels:
      nvidia.com/dynamo-graph-deployment-name: mocker
      nvidia.com/dynamo-component-type: decode
  targetPorts: [{number: 8000}]
  endpointPickerRef: {name: model-pool-epp, port: {number: 9002}, failureMode: FailOpen}
---
# BNK's picker for Dynamo. Settings proven on BNK 2.4 with Dynamo 1.5.1: Dynamo publishes KV events per
# endpoint, and the Mocker labels its vLLM metrics with model_name instead of Dynamo's component labels.
apiVersion: inference.k8s.f5.com/v1alpha1
kind: F5EPP
metadata: {name: model-pool-epp, namespace: inference}
spec:
  poolRef: {name: model-pool}
  engine: dynamo
  natsURL: nats://dynamo-platform-nats.dynamo-system.svc.cluster.local:4222
  server: {modelServerMetricsPort: 9090, secureServing: false, metricsEndpointAuth: false}
  tokenizer: {name: Qwen/Qwen3-0.6B}
  eppConfig:
    config:
      plugins:
      - name: dynamo-wire
        type: dynamo-wire
        parameters:
          kv_events_topic: component.backend.endpoint.generate.kv-events
          kv_metrics_topic: component.backend.endpoint.generate.kv_metrics
      - name: core-metrics-extractor
        type: core-metrics-extractor
        parameters:
          defaultEngine: vllm
          engineLabelKey: inference.networking.k8s.io/engine-type
          engineConfigs:
          - name: vllm
            kvUsageSpec: vllm:kv_cache_usage_perc{model_name="Qwen/Qwen3-0.6B"}
            queuedRequestsSpec: vllm:num_requests_waiting{model_name="Qwen/Qwen3-0.6B"}
            runningRequestsSpec: vllm:num_requests_running{model_name="Qwen/Qwen3-0.6B"}
            cacheInfoSpec: ""
            loraSpec: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: ai-picker, namespace: inference}
spec:
  gatewayClassName: f5-gateway-class
  addresses: [{type: IPAddress, value: 10.30.30.11}]
  listeners: [{name: http, protocol: HTTP, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: chat, namespace: inference}
spec:
  parentRefs: [{name: ai-picker, sectionName: http}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: model-pool, port: 8000}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: ai-roundrobin, namespace: inference}
spec:
  gatewayClassName: f5-gateway-class
  addresses: [{type: IPAddress, value: 10.30.30.12}]
  listeners: [{name: http, protocol: HTTP, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: chat-rr, namespace: inference}
spec:
  parentRefs: [{name: ai-roundrobin, sectionName: http}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs: [{name: mocker-frontend, port: 8000}]
